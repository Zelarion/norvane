<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Illustration of a walk-in cold room with a temperature readout">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45 0H0V45" fill="none" stroke="#5eead4" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="900" height="650" fill="url(#bg)"/>
  <rect width="900" height="650" fill="url(#grid)"/>
  <ellipse cx="450" cy="560" rx="300" ry="34" fill="#000" fill-opacity="0.28"/>

  <!-- cold room: top, side, front -->
  <polygon points="250,230 330,170 700,170 620,230" fill="#99f6e4"/>
  <polygon points="620,230 700,170 700,470 620,530" fill="#5eead4"/>
  <rect x="250" y="230" width="370" height="300" fill="url(#front)"/>
  <g stroke="#0f766e" stroke-opacity="0.18" stroke-width="2">
    <line x1="342" y1="230" x2="342" y2="530"/>
    <line x1="434" y1="230" x2="434" y2="530"/>
    <line x1="527" y1="230" x2="527" y2="530"/>
  </g>
  <!-- door -->
  <rect x="352" y="300" width="164" height="230" rx="6" fill="#0f766e"/>
  <rect x="364" y="312" width="140" height="206" rx="4" fill="#115e59"/>
  <rect x="478" y="396" width="10" height="54" rx="5" fill="#ccfbf1"/>
  <!-- display -->
  <rect x="400" y="262" width="68" height="26" rx="5" fill="#042f2e"/>
  <text x="434" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#5eead4">-18.0°C</text>

  <!-- snowflake -->
  <g stroke="#5eead4" stroke-width="5" stroke-linecap="round" transform="translate(170 150)">
    <line x1="0" y1="-48" x2="0" y2="48"/>
    <line x1="-42" y1="-24" x2="42" y2="24"/>
    <line x1="-42" y1="24" x2="42" y2="-24"/>
    <polyline points="-12,-38 0,-26 12,-38" fill="none"/>
    <polyline points="-12,38 0,26 12,38" fill="none"/>
  </g>

  <!-- floating chips -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="690" y="86" width="170" height="64" rx="14" fill="#0f172a" fill-opacity="0.78" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="712" y="112" font-size="12" fill="#99f6e4" letter-spacing="2">CORE TEMP</text>
    <text x="712" y="138" font-size="22" font-weight="700" fill="#ffffff">-18.0°C</text>
    <rect x="70" y="440" width="190" height="64" rx="14" fill="#0f172a" fill-opacity="0.78" stroke="#5eead4" stroke-opacity="0.5"/>
    <circle cx="96" cy="472" r="7" fill="#34d399"/>
    <text x="114" y="468" font-size="12" fill="#99f6e4" letter-spacing="2">ALARM</text>
    <text x="114" y="490" font-size="18" font-weight="700" fill="#ffffff">All clear</text>
  </g>
</svg>
